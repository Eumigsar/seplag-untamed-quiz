<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>修道 · Simulado SEPLAG-RJ · 陈情令</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#07050a;--jade:#3d8a65;--jade2:#5aad82;--jade-l:#c8ead8;
  --crim:#8b1a1a;--crim2:#b02020;--crim-l:#f5caca;
  --gold:#b8860b;--gold2:#d4a017;--gold3:#e8c048;
  --mist:#e8e0d0;--mist2:#f0ebe0;--cloud:#c8c0b0;--cloud2:#a89880;--cloud3:#706050;
}
html,body{height:100%;background:var(--ink);color:var(--mist);font-family:'Noto Serif SC',Georgia,serif;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;position:relative}

/* BG */
#bgwrap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
#bgwrap svg{width:100%;height:100%;display:block}

/* LAYER */
#layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100%}

/* API BAR */
#apibar{background:rgba(10,6,18,0.94);border-bottom:1px solid rgba(70,46,100,0.65);padding:7px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#apibar label{font-size:11px;color:var(--cloud2);letter-spacing:1px;white-space:nowrap}
#apikey{flex:1;background:rgba(8,5,14,0.85);border:1px solid rgba(60,38,85,0.7);border-radius:2px;color:var(--mist);font-family:'Courier New',monospace;font-size:12px;padding:5px 10px;outline:none;transition:border-color 0.2s}
#apikey:focus{border-color:var(--jade)}
#apikey::placeholder{color:var(--cloud3)}
#savebtn{background:rgba(18,40,20,0.92);border:1px solid var(--jade);color:var(--jade2);font-size:11px;padding:5px 14px;border-radius:2px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif;letter-spacing:1px;transition:all 0.15s}
#savebtn:hover{background:rgba(25,55,28,0.95)}
#kst{font-size:11px;color:var(--jade2);letter-spacing:1px;display:none}

/* HEADER */
.hdr{padding:12px 20px 10px;background:rgba(7,5,10,0.9);border-bottom:1px solid rgba(58,40,82,0.7);flex-shrink:0;position:relative;overflow:hidden}
.hdr-deco{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0.08}
.hdr-in{display:flex;justify-content:space-between;align-items:center;position:relative}
.hdr-t{font-size:17px;font-weight:600;color:var(--gold2);letter-spacing:3px}
.hdr-s{font-size:10px;color:var(--cloud2);letter-spacing:2px;margin-top:2px}
.hdr-b{font-size:10px;background:rgba(18,8,28,0.92);border:1px solid rgba(88,46,120,0.65);color:#c8a8e0;padding:3px 11px;border-radius:2px;letter-spacing:2px}
#stk{font-size:10px;color:var(--gold2);letter-spacing:1px;margin-top:3px;text-align:right;display:none}

/* NAV */
.nav{display:flex;background:rgba(5,3,9,0.94);border-bottom:1px solid rgba(46,30,66,0.7);flex-shrink:0}
.nb{flex:1;padding:10px 4px;font-size:12px;font-family:Georgia,serif;cursor:pointer;border:none;background:transparent;color:var(--cloud2);letter-spacing:1px;transition:all 0.2s;border-bottom:2px solid transparent}
.nb:hover{color:var(--mist);background:rgba(14,10,22,0.7)}
.nb.on{color:var(--gold2);border-bottom-color:var(--gold2)}

/* SCROLL */
.scr{flex:1;overflow-y:auto;padding:14px 20px 20px;scrollbar-width:thin;scrollbar-color:rgba(88,46,120,0.4) transparent}
.scr::-webkit-scrollbar{width:4px}
.scr::-webkit-scrollbar-thumb{background:rgba(88,46,120,0.5);border-radius:2px}

/* CARDS */
.card{background:rgba(12,8,20,0.92);border:1px solid rgba(56,36,78,0.72);border-radius:4px;padding:14px 16px;margin-bottom:12px;position:relative}
.card::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--jade);border-radius:0 2px 2px 0}
.card.cr::before{background:var(--crim2)}
.card.cg::before{background:var(--gold)}
.clabel{font-size:10px;color:var(--cloud2);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.clabel::after{content:'';flex:1;height:1px;background:rgba(56,36,78,0.5)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid rgba(66,44,90,0.72);border-radius:2px;padding:6px 13px;font-size:11px;font-family:Georgia,serif;cursor:pointer;background:rgba(8,5,15,0.75);color:var(--cloud);transition:all 0.15s;letter-spacing:0.5px}
.chip:hover{background:rgba(20,14,32,0.88);border-color:rgba(96,62,128,0.8);color:var(--mist)}
.chip.on{background:rgba(18,38,20,0.92);border-color:var(--jade);color:var(--jade2)}
.chip.hot::before{content:'✦ ';font-size:8px;color:var(--gold2)}

/* BUTTONS */
.bmain{width:100%;padding:12px;background:rgba(18,38,20,0.92);border:1px solid var(--jade);color:var(--jade2);font-family:Georgia,serif;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:2px;margin-top:13px;transition:all 0.2s}
.bmain:hover{background:rgba(26,54,30,0.96);border-color:var(--jade2)}
.bmain:disabled{opacity:0.35;cursor:not-allowed}
.bj{padding:9px 18px;background:rgba(18,38,20,0.92);border:1px solid var(--jade);color:var(--jade2);font-family:Georgia,serif;font-size:12px;cursor:pointer;border-radius:2px;transition:all 0.15s;letter-spacing:1px}
.bj:hover{background:rgba(26,54,30,0.96)}
.bj:disabled{opacity:0.4;cursor:not-allowed}
.bg{padding:9px 18px;background:rgba(12,8,20,0.88);border:1px solid rgba(56,36,78,0.72);color:var(--cloud);font-family:Georgia,serif;font-size:12px;cursor:pointer;border-radius:2px;transition:all 0.15s}
.bg:hover{color:var(--mist);background:rgba(20,14,32,0.92)}

/* PROGRESS */
.pg{height:3px;background:rgba(46,30,66,0.55);border-radius:2px;margin-bottom:14px;overflow:hidden}
.pgf{height:100%;background:var(--jade);border-radius:2px;transition:width 0.4s}

/* ALTERNATIVAS */
.alt{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border:1px solid rgba(50,33,70,0.72);border-radius:2px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;font-size:13px;line-height:1.7;color:var(--cloud);background:rgba(8,5,15,0.72);font-family:Georgia,serif}
.alt:hover:not(.lk){background:rgba(16,11,28,0.92);border-color:rgba(92,60,124,0.72);color:var(--mist)}
.alt .L{font-weight:700;min-width:17px;color:var(--cloud2);font-family:sans-serif;font-size:11px;margin-top:2px}
.alt.sa{border-color:var(--jade);background:rgba(12,28,15,0.92);color:var(--jade-l)}
.alt.sa .L{color:var(--jade2)}
.alt.ok{border-color:var(--jade);background:rgba(14,36,18,0.92);color:var(--jade-l)}
.alt.ok .L{color:var(--jade2)}
.alt.no{border-color:var(--crim2);background:rgba(36,8,8,0.92);color:var(--crim-l)}
.alt.no .L{color:#e07070}

/* COMENTÁRIO */
.comt{margin-top:12px;padding:12px 14px;background:rgba(6,18,10,0.94);border:1px solid rgba(26,56,33,0.72);border-left:3px solid var(--jade);border-radius:0 2px 2px 0;font-size:12px;line-height:1.85;color:var(--mist2);display:none;font-family:Georgia,serif}
.comt b{color:var(--jade2);font-weight:600}

/* TAGS */
.tag{font-size:9px;padding:2px 8px;border-radius:2px;letter-spacing:1px;font-family:sans-serif}
.tj{background:rgba(12,28,15,0.92);border:1px solid rgba(38,66,42,0.72);color:var(--jade2)}
.tc{background:rgba(28,6,6,0.92);border:1px solid rgba(64,18,18,0.72);color:#e07070}
.tg{background:rgba(26,17,0,0.92);border:1px solid rgba(64,50,0,0.72);color:var(--gold2)}
.ts{background:rgba(18,14,28,0.92);border:1px solid rgba(48,36,66,0.72);color:var(--cloud2)}

/* RESULTADO */
.sbig{font-size:52px;font-weight:700;text-align:center;letter-spacing:5px;line-height:1}
.s3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:14px 0}
.sb{background:rgba(8,5,15,0.82);border:1px solid rgba(50,33,70,0.72);border-radius:2px;padding:11px;text-align:center}
.sv{font-size:22px;font-weight:700;letter-spacing:2px}
.sl{font-size:9px;color:var(--cloud2);margin-top:4px;letter-spacing:1px}

/* HISTÓRICO */
.hrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(36,24,52,0.55)}
.hn{font-size:11px;color:var(--cloud2);min-width:185px}
.ht{flex:1;height:5px;background:rgba(36,24,52,0.55);border-radius:2px;overflow:hidden}
.hb{height:100%;border-radius:2px;transition:width 0.6s}
.hp{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.hn2{font-size:10px;color:var(--cloud2);min-width:44px;text-align:right}

/* REVISÃO */
.ri{border:1px solid rgba(50,33,70,0.72);border-radius:4px;padding:13px 15px;margin-bottom:9px;background:rgba(8,5,15,0.9)}
.rq{font-size:13px;line-height:1.78;margin-bottom:9px;color:var(--mist);font-family:Georgia,serif}
details summary{cursor:pointer;font-size:10px;color:var(--cloud2);letter-spacing:1px;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--jade2)}
details .db{margin-top:7px;padding:9px 11px;background:rgba(6,18,10,0.88);border:1px solid rgba(26,56,33,0.55);border-radius:2px;font-size:12px;line-height:1.78;color:var(--mist2);font-family:Georgia,serif}

/* LOADING/ERR */
.loading{text-align:center;padding:3rem;color:var(--cloud2)}
.sp{display:inline-block;width:22px;height:22px;border:2px solid rgba(56,36,78,0.45);border-top-color:var(--jade);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.errb{background:rgba(36,8,8,0.92);border:1px solid rgba(64,18,18,0.72);border-radius:3px;padding:13px;font-size:12px;color:#e07070;line-height:1.75;margin-top:9px}
.dv{height:1px;background:linear-gradient(to right,transparent,rgba(88,46,120,0.55) 30%,rgba(88,46,120,0.55) 70%,transparent);margin:12px 0}

/* PERSONAGEM POPUP */
#cpop{position:fixed;bottom:0;right:calc(50% - 500px);width:310px;z-index:200;display:none;flex-direction:row;align-items:flex-end;pointer-events:none}
@media(max-width:1000px){#cpop{right:0}}
.cbub{flex:1;background:rgba(10,6,20,0.98);border:1px solid rgba(76,46,108,0.92);border-radius:8px 8px 8px 0;padding:13px 15px;margin-bottom:24px;pointer-events:auto;position:relative}
.cbub::after{content:'';position:absolute;bottom:16px;right:-8px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:8px solid rgba(76,46,108,0.92)}
.cname{font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.cmsg{font-size:13px;line-height:1.72;color:var(--mist);font-family:Georgia,serif}
.cclose{display:block;margin-top:9px;font-size:10px;color:var(--cloud2);cursor:pointer;letter-spacing:1px;text-align:right;pointer-events:auto;background:none;border:none;font-family:Georgia,serif;transition:color 0.15s}
.cclose:hover{color:var(--jade2)}
.cfig{width:100px;flex-shrink:0;position:relative;bottom:-2px}
.cfig svg{width:100%;display:block}
</style>
</head>

// ── API KEY ──
function saveKey(){
  const v=document.getElementById('apikey').value.trim();
  if(v){
    apiKey=v;
    localStorage.setItem('sk_seplag',v);
    const s=document.getElementById('kst');
    s.style.display='block';
    setTimeout(()=>s.style.display='none',2500);
  }
}
if(apiKey){
  document.getElementById('apikey').value=apiKey;
  document.getElementById('kst').style.display='block';
  setTimeout(()=>{document.getElementById('kst').style.display='none'},2000);
}
document.getElementById('apikey').addEventListener('keydown',e=>{if(e.key==='Enter')saveKey();});

// ── PERSONAGEM ──
function cShow(ok){
  if(!ok)return;
  cAc++;
  const k=cAc%2===0?'lz':'wx';
  const ch=CHARS[k];
  const msg=ch.msgs[Math.floor(Math.random()*ch.msgs.length)];
  document.getElementById('cname').textContent=ch.name;
  document.getElementById('cname').style.color=ch.col;
  document.getElementById('cmsg').textContent=msg;
  document.getElementById('csvg').innerHTML=ch.svg;
  document.getElementById('cpop').style.display='flex';
  if(window._ct)clearTimeout(window._ct);
  window._ct=setTimeout(cClose,5500);
}
function cClose(){
  document.getElementById('cpop').style.display='none';
  if(window._ct)clearTimeout(window._ct);
}

// ── CHIPS ──
function mkChips(id,items,key,isObj){
  const el=document.getElementById(id);
  el.innerHTML='';
  items.forEach((it,i)=>{
    const lbl=isObj?it.l:it;
    const isSel=isObj?(cfg[key]===it):(key==='hot'?(i===0?cfg.hot:!cfg.hot):(cfg[key]===it||cfg[key]===Number(it)));
    const d=document.createElement('div');
    d.className='chip'+(isSel?' on':'')+(isObj&&it.hot?' hot':'');
    d.textContent=lbl;
    d.onclick=()=>{
      el.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      d.classList.add('on');
      if(key==='hot') cfg.hot=(i===0);
      else if(key==='mat') cfg.mat=it;
      else cfg[key]=isNaN(Number(it))?it:Number(it);
    };
    el.appendChild(d);
  });
}
mkChips('cm',MAT,'mat',true);
mkChips('cd',DIF,'dif',false);
mkChips('ch',HOTS,'hot',false);
mkChips('cq',QTDS,'qtd',false);

// ── TABS ──
function tab(t){
  ['sim','rev','hist'].forEach(x=>{
    document.getElementById('t-'+x).style.display=x===t?'block':'none';
  });
  document.querySelectorAll('.nb').forEach((b,i)=>{
    b.classList.toggle('on',['sim','rev','hist'][i]===t);
  });
  if(t==='rev') renderRev();
  if(t==='hist') renderHist();
}

// ── GERAR QUESTÕES ──
async function gerar(){
  if(!apiKey){
    alert('⚠ Insira sua chave API Anthropic no campo acima.\n\nAcesse: console.anthropic.com → API Keys\nCrie uma chave e cole aqui.');
    document.getElementById('apikey').focus();
    return;
  }
  const btn=document.getElementById('bgen');
  btn.disabled=true;
  btn.textContent='⏳ O Patriarca está invocando questões...';
  document.getElementById('cfg').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('quiz').innerHTML=`<div class="loading"><div class="sp"></div><br>Gerando ${cfg.qtd} questões sobre<br><span style="color:#d4a017;letter-spacing:2px">${cfg.mat.l}</span><br><span style="font-size:10px;letter-spacing:1px;margin-top:6px;display:block;color:#a89880">dificuldade · ${cfg.dif}</span></div>`;

  const hotI=cfg.hot
    ?'IMPORTANTE: foque nos tópicos mais cobrados pela FGV para EPPGG e APO em concursos 2019-2025.'
    :'Varie os tópicos de forma equilibrada.';

  const prompt=`Você é especialista em concursos públicos FGV para SEPLAG-RJ 2026 (cargos EPPGG e APO).
Gere exatamente ${cfg.qtd} questões de múltipla escolha sobre "${cfg.mat.l}" com dificuldade "${cfg.dif}".
${hotI}
Responda SOMENTE com JSON válido, sem texto antes, depois ou markdown.
{"questoes":[{"enunciado":"texto","alternativas":["A) texto","B) texto","C) texto","D) texto","E) texto"],"gabarito":0,"comentario":"explicação detalhada com fundamento legal ou doutrinário","topico":"subtópico específico","probabilidade":"alta|media|baixa"}]}
"gabarito" = índice 0-4 da alternativa correta. Nível compatível com cargo superior FGV.`;

  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:4000,
        messages:[{role:'user',content:prompt}]
      })
    });
    if(!r.ok){
      const e=await r.json().catch(()=>({}));
      throw new Error((e.error&&e.error.message)||`HTTP ${r.status}`);
    }
    const data=await r.json();
    const txt=data.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim();
    qs=JSON.parse(txt).questoes;
    at=0;ac=0;si=null;resp=false;
    renderQ();
  }catch(e){
    document.getElementById('quiz').innerHTML=`<div class="errb">⚠ Erro ao invocar questões: ${e.message}<br><small style="opacity:0.7;margin-top:5px;display:block">Verifique a chave API e a conexão com a internet.</small></div><button class="bg" style="margin-top:11px;width:100%" onclick="voltarCfg()">← voltar às configurações</button>`;
    btn.disabled=false;
    btn.textContent='⚡ invocar questões com IA · 以武入道';
  }
}

// ── RENDERIZAR QUESTÃO ──
function renderQ(){
  if(at>=qs.length){resultado();return;}
  resp=false;si=null;
  const q=qs[at];
  const pct=Math.round((at/qs.length)*100);
  const ht=q.probabilidade==='alta'?'<span class="tag tg">✦ alta chance</span>':'';
  const alts=q.alternativas.map((a,i)=>`<div class="alt" id="a${i}" onclick="selA(${i})"><span class="L">${['A','B','C','D','E'][i]}</span><span>${a.replace(/^[A-E]\)\s*/,'')}</span></div>`).join('');
  document.getElementById('quiz').innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:7px">
      <span style="font-size:10px;color:#a89880;letter-spacing:1px">questão ${at+1} · ${qs.length}</span>
      <span style="font-size:10px;color:#5aad82;letter-spacing:1px">${ac} acerto${ac!==1?'s':''}</span>
    </div>
    <div class="pg"><div class="pgf" style="width:${pct}%"></div></div>
    <div class="card">
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
        <span class="tag tj">${cfg.mat.l}</span>
        <span class="tag tc">${cfg.dif}</span>
        ${q.topico?`<span class="tag ts">${q.topico}</span>`:''}
        ${ht}
      </div>
      <p style="font-size:13px;line-height:1.82;color:#e8e0d0;margin-bottom:13px;font-family:Georgia,serif">${q.enunciado}</p>
      ${alts}
      <button class="bj" id="bconf" onclick="conf()" disabled style="width:100%;margin-top:11px;letter-spacing:2px">confirmar resposta · 确认</button>
      <div class="comt" id="comt"><b>✦ comentário:</b><br><br>${q.comentario}</div>
      <button class="bg" id="bprox" style="display:none;width:100%;margin-top:9px" onclick="prox()">${at+1<qs.length?'próxima questão →':'ver resultado →'}</button>
    </div>`;
}

function selA(i){
  if(resp)return;
  si=i;
  document.querySelectorAll('.alt').forEach((el,j)=>el.classList.toggle('sa',j===i));
  document.getElementById('bconf').disabled=false;
}

function conf(){
  if(si===null||resp)return;
  resp=true;
  const q=qs[at];
  const ok=(si===q.gabarito);
  if(ok)ac++;
  const mid=cfg.mat.id;
  if(!hist[mid])hist[mid]={l:cfg.mat.l,tot:0,ac:0};
  hist[mid].tot++;
  if(ok)hist[mid].ac++;
  if(!ok)toRev.push({q,mat:cfg.mat.l,resp:si});
  document.querySelectorAll('.alt').forEach((el,i)=>{
    el.classList.add('lk');
    if(i===q.gabarito)el.classList.add('ok');
    else if(i===si&&!ok)el.classList.add('no');
  });
  document.getElementById('comt').style.display='block';
  document.getElementById('bconf').style.display='none';
  document.getElementById('bprox').style.display='block';
  cShow(ok);
}

function prox(){at++;cClose();renderQ();}

// ── RESULTADO ──
function resultado(){
  const pct=Math.round((ac/qs.length)*100);
  const err=qs.length-ac;
  if(pct>=70)streak++;else streak=0;
  if(streak>1){
    const s=document.getElementById('stk');
    s.style.display='block';
    s.textContent='✦ '+streak+' simulados ≥70% ✦';
  }
  const cor=pct>=70?'#5aad82':pct>=50?'#d4a017':'#e07070';
  const msg=pct>=70?'优秀修炼 · excelente cultivo':pct>=50?'继续修炼 · continue praticando':'坚持修炼 · não desista!';
  document.getElementById('quiz').innerHTML=`
    <div class="card" style="text-align:center;padding:1.8rem 1.5rem">
      <div style="font-size:22px;margin-bottom:12px;letter-spacing:4px;color:#d4a017">⚔ 结果 ⚔</div>
      <div class="sbig" style="color:${cor}">${pct}%</div>
      <div style="font-size:12px;color:#a89880;text-align:center;letter-spacing:2px;margin-top:6px">${msg}</div>
      <div class="dv"></div>
      <div class="s3">
        <div class="sb"><div class="sv" style="color:#5aad82">${ac}</div><div class="sl">acertos</div></div>
        <div class="sb"><div class="sv" style="color:#e07070">${err}</div><div class="sl">erros</div></div>
        <div class="sb"><div class="sv">${qs.length}</div><div class="sl">total</div></div>
      </div>
      ${toRev.length>0?`<p style="font-size:10px;color:#a89880;letter-spacing:1px;margin-top:7px">✦ ${toRev.length} questão${toRev.length>1?'s':''} aguardando revisão</p>`:''}
      <div style="display:flex;gap:9px;margin-top:15px">
        <button class="bg" style="flex:1" onclick="voltarCfg()">↺ novo simulado</button>
        ${toRev.length>0?`<button class="bj" style="flex:1" onclick="tab('rev')">☯ revisar erros</button>`:''}
      </div>
    </div>`;
  cClose();
}

function voltarCfg(){
  qs=[];at=0;ac=0;
  cClose();
  document.getElementById('cfg').style.display='block';
  document.getElementById('quiz').style.display='none';
  document.getElementById('quiz').innerHTML='';
  const btn=document.getElementById('bgen');
  btn.disabled=false;
  btn.textContent='⚡ invocar questões com IA · 以武入道';
}

// ── REVISÃO ──
function renderRev(){
  const el=document.getElementById('rev-c');
  if(!toRev.length){
    el.innerHTML='<div class="card" style="text-align:center;padding:2.5rem"><div style="font-size:42px;margin-bottom:12px">☯</div><div style="color:#5aad82;font-size:13px;letter-spacing:2px">nenhuma questão para revisar</div><div style="font-size:11px;color:#a89880;margin-top:7px;letter-spacing:1px">os erros dos simulados aparecem aqui</div></div>';
    return;
  }
  const L=['A','B','C','D','E'];
  el.innerHTML='<div style="font-size:10px;color:#a89880;letter-spacing:2px;margin-bottom:12px">✦ '+toRev.length+' questão'+(toRev.length>1?'s':'')+' para revisar</div>'+
    toRev.map((it,idx)=>{
      const q=it.q;
      return`<div class="ri">
        <div style="font-size:9px;color:#a89880;letter-spacing:1px;margin-bottom:6px">✦ ${it.mat} · ${q.topico||''}</div>
        <div class="rq">${q.enunciado}</div>
        <div style="font-size:12px;margin-bottom:9px;display:flex;flex-direction:column;gap:4px">
          <span style="color:#e07070">✗ sua resposta: ${L[it.resp]}) ${q.alternativas[it.resp].replace(/^[A-E]\)\s*/,'')}</span>
          <span style="color:#5aad82">✓ correta: ${L[q.gabarito]}) ${q.alternativas[q.gabarito].replace(/^[A-E]\)\s*/,'')}</span>
        </div>
        <details>
          <summary>✦ ver comentário</summary>
          <div class="db">${q.comentario}</div>
        </details>
        <button class="bg" style="margin-top:9px;font-size:10px;padding:5px 13px" onclick="rmRev(${idx})">✓ marcar como revisada</button>
      </div>`;
    }).join('');
}
function rmRev(i){toRev.splice(i,1);renderRev();}

// ── DESEMPENHO ──
function renderHist(){
  const el=document.getElementById('hist-c');
  const keys=Object.keys(hist);
  if(!keys.length){
    el.innerHTML='<div class="card" style="text-align:center;padding:2.5rem"><div style="font-size:42px;margin-bottom:12px">卷</div><div style="color:#d4a017;font-size:13px;letter-spacing:2px">nenhum dado ainda</div><div style="font-size:11px;color:#a89880;margin-top:7px;letter-spacing:1px">faça simulados para ver sua evolução</div></div>';
    return;
  }
  let tG=0,aG=0;
  keys.forEach(k=>{tG+=hist[k].tot;aG+=hist[k].ac;});
  const pG=Math.round((aG/tG)*100);
  const cG=pG>=70?'#5aad82':pG>=50?'#d4a017':'#e07070';
  const rows=keys.map(k=>{
    const h=hist[k];
    const p=Math.round((h.ac/h.tot)*100);
    const c=p>=70?'#3d8a65':p>=50?'#d4a017':'#b02020';
    return`<div class="hrow">
      <div class="hn">${h.l}</div>
      <div class="ht"><div class="hb" style="width:${p}%;background:${c}"></div></div>
      <div class="hp" style="color:${c}">${p}%</div>
      <div class="hn2">${h.ac}/${h.tot}</div>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="s3" style="margin-bottom:15px">
      <div class="sb"><div class="sv" style="color:${cG}">${pG}%</div><div class="sl">aproveitamento</div></div>
      <div class="sb"><div class="sv">${tG}</div><div class="sl">questões feitas</div></div>
      <div class="sb"><div class="sv" style="color:#5aad82">${aG}</div><div class="sl">acertos totais</div></div>
    </div>
    <div class="card" style="padding:13px 16px">
      <div class="clabel">✦ desempenho por matéria</div>
      ${rows}
    </div>
    <button class="bg" style="width:100%;margin-top:9px;font-size:10px"
      onclick="if(confirm('Limpar todo o histórico de desempenho?')){hist={};renderHist()}">
      ✕ limpar histórico
    </button>`;
}
</script>
