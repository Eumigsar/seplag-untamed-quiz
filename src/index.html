<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
<title>修道 · Simulado SEPLAG-RJ · 陈情令</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#050b18;
  --jade:#18b870;--jade2:#40d490;--jade3:#80eebc;--jade-l:#b8f8da;
  --lotus:#d03868;--lotus2:#e86090;--lotus3:#f8a0c0;--lotus-l:#fdd8e8;
  --gold:#c88808;--gold2:#e8a818;--gold3:#fcd040;--gold-l:#fdeea0;
  --sky:#2858b0;--sky2:#4888d8;--sky3:#88b8f0;--sky-l:#c8e0f8;
  --pur:#6030a8;--pur2:#9060d8;--pur3:#c090f0;
  --crim:#8b0000;--crim2:#c82828;--crim3:#f04848;--crim-l:#fcc8c8;
  --mist:#ece4d4;--mist2:#f4eed8;--cloud:#c4baa8;--cloud2:#a09080;--cloud3:#685848;
}
html,body{height:100%;background:var(--ink);color:var(--mist);font-family:'Noto Serif SC',Georgia,serif;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;position:relative}

/* BG */
#bgwrap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;transition:opacity 0.7s}
#bgwrap svg{width:100%;height:100%;display:block}
#bgphoto-sim,#bgphoto-rev,#bgphoto-hist{transition:opacity 0.7s}
#bgtint{mix-blend-mode:multiply}

/* LAYER */
#layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;width:100%}

/* API BAR */
#apibar{background:rgba(5,11,24,0.97);border-bottom:2px solid rgba(40,88,176,0.55);padding:7px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#apibar label{font-size:11px;color:var(--sky3);letter-spacing:1px;white-space:nowrap}
#apikey{flex:1;background:rgba(8,18,42,0.92);border:1px solid rgba(40,80,168,0.55);border-radius:3px;color:var(--mist);font-family:'Courier New',monospace;font-size:12px;padding:5px 10px;outline:none;transition:border-color 0.2s}
#apikey:focus{border-color:var(--jade2)}
#apikey::placeholder{color:var(--cloud3)}
#savebtn{background:linear-gradient(135deg,#0e4830,#186840);border:1px solid var(--jade);color:var(--jade3);font-size:11px;padding:5px 16px;border-radius:3px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif;letter-spacing:1px;box-shadow:0 0 10px rgba(24,184,112,0.35);transition:all 0.15s}
#savebtn:hover{box-shadow:0 0 18px rgba(64,212,144,0.5)}
#kst{font-size:11px;color:var(--jade2);letter-spacing:1px;display:none}
#musibtn{background:rgba(88,40,160,0.88);border:1px solid var(--pur2);color:var(--pur3);font-size:11px;padding:5px 13px;border-radius:3px;cursor:pointer;white-space:nowrap;letter-spacing:1px;transition:all 0.15s;box-shadow:0 0 9px rgba(144,96,216,0.32);font-family:Georgia,serif}
#musibtn:hover{box-shadow:0 0 16px rgba(176,122,224,0.5)}
#musibtn.on{background:rgba(96,48,180,0.96);border-color:var(--pur3);box-shadow:0 0 16px rgba(176,122,224,0.55)}

/* HEADER — cena Cloud Recesses */
.hdr{padding:0;background:rgba(5,11,24,0.97);border-bottom:2px solid rgba(40,88,176,0.45);flex-shrink:0;position:relative;overflow:hidden}
.hdr-scene{display:block;width:100%;height:130px}
.hdr-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 20px 13px;background:linear-gradient(to top,rgba(5,11,24,0.98) 35%,transparent);display:flex;justify-content:space-between;align-items:flex-end}
.hdr-t{font-size:17px;font-weight:600;color:var(--gold3);letter-spacing:3px;text-shadow:0 0 22px rgba(252,208,64,0.65)}
.hdr-s{font-size:10px;color:var(--sky3);letter-spacing:2px;margin-top:2px}
.hdr-b{font-size:10px;background:rgba(96,48,168,0.88);border:1px solid var(--pur2);color:var(--pur3);padding:3px 12px;border-radius:3px;letter-spacing:2px;box-shadow:0 0 12px rgba(144,96,216,0.45)}
#stk{font-size:10px;color:var(--gold2);letter-spacing:1px;margin-top:3px;text-align:right;display:none}

/* NAV */
.nav{display:flex;background:rgba(5,11,24,0.99);border-bottom:2px solid rgba(40,88,176,0.4);flex-shrink:0}
.nb{flex:1;padding:10px 4px;font-size:12px;font-family:Georgia,serif;cursor:pointer;border:none;background:transparent;color:var(--cloud2);letter-spacing:1px;transition:all 0.2s;border-bottom:3px solid transparent}
.nb:hover{color:var(--mist);background:rgba(15,30,60,0.7)}
.nb.on{color:var(--gold3);border-bottom-color:var(--gold2);background:rgba(15,30,60,0.55);text-shadow:0 0 14px rgba(252,208,64,0.55)}

/* SCROLL */
.scr{flex:1;overflow-y:auto;padding:14px 20px 20px;scrollbar-width:thin;scrollbar-color:rgba(72,136,216,0.45) transparent}
.scr::-webkit-scrollbar{width:4px}
.scr::-webkit-scrollbar-thumb{background:rgba(72,136,216,0.55);border-radius:2px}

/* LOCATION BANNER (cenas menores dentro das seções) */
.loc-banner{width:100%;border-radius:6px;overflow:hidden;margin-bottom:12px;display:block;border:1px solid rgba(40,88,176,0.35)}

/* CARDS */
.card{background:linear-gradient(135deg,rgba(10,22,50,0.97),rgba(7,16,38,0.97));border:1px solid rgba(40,88,176,0.42);border-radius:6px;padding:14px 16px;margin-bottom:12px;position:relative;box-shadow:0 4px 24px rgba(0,0,0,0.45)}
.card::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--jade);border-radius:0 2px 2px 0}
.card.cr{border-color:rgba(200,40,40,0.5)}
.card.cr::before{background:var(--crim2)}
.card.cg{border-color:rgba(200,140,20,0.5)}
.card.cg::before{background:var(--gold2)}
.card.clt{border-color:rgba(208,56,104,0.5)}
.card.clt::before{background:var(--lotus2)}
.card.csk{border-color:rgba(40,88,176,0.55)}
.card.csk::before{background:var(--sky2)}
.clabel{font-size:10px;color:var(--cloud2);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.clabel::after{content:'';flex:1;height:1px;background:rgba(40,88,176,0.35)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid rgba(40,88,176,0.55);border-radius:3px;padding:6px 14px;font-size:11px;font-family:Georgia,serif;cursor:pointer;background:rgba(8,18,44,0.82);color:var(--cloud);transition:all 0.15s;letter-spacing:0.5px}
.chip:hover{background:rgba(18,40,96,0.9);border-color:var(--sky2);color:var(--mist)}
.chip.on{background:linear-gradient(135deg,rgba(14,72,48,0.95),rgba(24,120,80,0.95));border-color:var(--jade);color:var(--jade3);box-shadow:0 0 12px rgba(24,184,112,0.4)}
.chip.hot::before{content:'✦ ';font-size:8px;color:var(--gold2)}

/* BUTTONS */
.bmain{width:100%;padding:13px;background:linear-gradient(135deg,rgba(24,120,80,0.95),rgba(14,72,48,0.95));border:1px solid var(--jade);color:var(--jade3);font-family:Georgia,serif;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:4px;margin-top:13px;transition:all 0.2s;box-shadow:0 0 18px rgba(24,184,112,0.4),0 4px 14px rgba(0,0,0,0.35)}
.bmain:hover{box-shadow:0 0 28px rgba(64,212,144,0.55),0 6px 18px rgba(0,0,0,0.4);transform:translateY(-1px)}
.bmain:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.bj{padding:9px 18px;background:linear-gradient(135deg,rgba(14,72,48,0.92),rgba(24,120,80,0.92));border:1px solid var(--jade);color:var(--jade3);font-family:Georgia,serif;font-size:12px;cursor:pointer;border-radius:3px;transition:all 0.15s;letter-spacing:1px;box-shadow:0 0 9px rgba(24,184,112,0.3)}
.bj:hover{box-shadow:0 0 16px rgba(64,212,144,0.45)}
.bj:disabled{opacity:0.4;cursor:not-allowed}
.bg{padding:9px 18px;background:rgba(10,22,50,0.9);border:1px solid rgba(40,88,176,0.52);color:var(--cloud);font-family:Georgia,serif;font-size:12px;cursor:pointer;border-radius:3px;transition:all 0.15s}
.bg:hover{color:var(--mist);background:rgba(18,40,96,0.92);border-color:var(--sky2)}

/* PROGRESS */
.pg{height:4px;background:rgba(40,88,176,0.28);border-radius:2px;margin-bottom:14px;overflow:hidden}
.pgf{height:100%;background:linear-gradient(to right,var(--jade),var(--jade2));border-radius:2px;transition:width 0.4s;box-shadow:0 0 10px rgba(64,212,144,0.65)}

/* ALTERNATIVAS */
.alt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid rgba(40,88,176,0.42);border-radius:4px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;font-size:13px;line-height:1.7;color:var(--cloud);background:rgba(8,18,44,0.78);font-family:Georgia,serif}
.alt:hover:not(.lk){background:rgba(18,40,96,0.92);border-color:var(--sky2);color:var(--mist)}
.alt .L{font-weight:700;min-width:18px;color:var(--sky3);font-family:sans-serif;font-size:11px;margin-top:2px}
.alt.sa{border-color:var(--sky2);background:rgba(12,38,90,0.92);color:var(--sky-l)}
.alt.sa .L{color:var(--sky3)}
.alt.ok{border-color:var(--jade);background:rgba(8,48,26,0.96);color:var(--jade-l);box-shadow:0 0 10px rgba(24,184,112,0.28)}
.alt.ok .L{color:var(--jade2)}
.alt.no{border-color:var(--crim2);background:rgba(48,8,8,0.96);color:var(--crim-l);box-shadow:0 0 10px rgba(200,40,40,0.22)}
.alt.no .L{color:var(--crim3)}

/* COMENTÁRIO */
.comt{margin-top:12px;padding:12px 15px;background:rgba(5,24,13,0.97);border:1px solid rgba(24,120,80,0.52);border-left:3px solid var(--jade);border-radius:0 4px 4px 0;font-size:12px;line-height:1.88;color:var(--mist2);display:none;font-family:Georgia,serif}
.comt b{color:var(--jade2);font-weight:600}

/* TAGS */
.tag{font-size:9px;padding:2px 9px;border-radius:3px;letter-spacing:1px;font-family:sans-serif}
.tj{background:rgba(8,48,26,0.97);border:1px solid rgba(24,120,80,0.58);color:var(--jade2)}
.tc{background:rgba(40,8,8,0.97);border:1px solid rgba(200,40,40,0.55);color:var(--crim3)}
.tg{background:rgba(36,22,0,0.97);border:1px solid rgba(200,140,20,0.55);color:var(--gold2)}
.ts{background:rgba(8,20,50,0.97);border:1px solid rgba(40,88,176,0.55);color:var(--sky3)}

/* RESULTADO */
.sbig{font-size:52px;font-weight:700;text-align:center;letter-spacing:5px;line-height:1}
.s3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:14px 0}
.sb{background:rgba(8,18,44,0.88);border:1px solid rgba(40,88,176,0.42);border-radius:4px;padding:11px;text-align:center}
.sv{font-size:22px;font-weight:700;letter-spacing:2px}
.sl{font-size:9px;color:var(--cloud2);margin-top:4px;letter-spacing:1px}

/* HISTÓRICO */
.hrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(40,88,176,0.22)}
.hn{font-size:11px;color:var(--cloud2);min-width:185px}
.ht{flex:1;height:5px;background:rgba(40,88,176,0.22);border-radius:2px;overflow:hidden}
.hb{height:100%;border-radius:2px;transition:width 0.6s}
.hp{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.hn2{font-size:10px;color:var(--cloud2);min-width:44px;text-align:right}

/* REVISÃO */
.ri{border:1px solid rgba(40,88,176,0.42);border-radius:6px;padding:13px 15px;margin-bottom:9px;background:rgba(8,18,44,0.94)}
.rq{font-size:13px;line-height:1.78;margin-bottom:9px;color:var(--mist);font-family:Georgia,serif}
details summary{cursor:pointer;font-size:10px;color:var(--cloud2);letter-spacing:1px;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--jade2)}
details .db{margin-top:7px;padding:9px 12px;background:rgba(5,24,13,0.92);border:1px solid rgba(24,120,80,0.38);border-radius:3px;font-size:12px;line-height:1.78;color:var(--mist2);font-family:Georgia,serif}

/* LOADING / ERRO */
.loading{text-align:center;padding:3rem;color:var(--cloud2)}
.sp{display:inline-block;width:24px;height:24px;border:2px solid rgba(40,88,176,0.28);border-top-color:var(--jade2);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.errb{background:rgba(48,8,8,0.97);border:1px solid rgba(200,40,40,0.55);border-radius:4px;padding:13px;font-size:12px;color:var(--crim3);line-height:1.75;margin-top:9px}
.dv{height:1px;background:linear-gradient(to right,transparent,rgba(72,136,216,0.55) 30%,rgba(72,136,216,0.55) 70%,transparent);margin:12px 0}

/* USER MODAL */
#user-modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:600;background:rgba(2,4,10,0.97);display:flex;align-items:center;justify-content:center}
#user-box{background:linear-gradient(135deg,rgba(8,18,50,0.99),rgba(5,12,30,0.99));border:1px solid rgba(40,88,176,0.55);border-radius:8px;padding:36px 38px;max-width:420px;width:88%;text-align:center;box-shadow:0 0 60px rgba(40,88,176,0.22),0 20px 60px rgba(0,0,0,0.7)}
.uubtn{display:block;width:100%;padding:9px 14px;margin-bottom:7px;background:rgba(8,18,44,0.88);border:1px solid rgba(40,88,176,0.42);border-radius:4px;color:var(--cloud);font-family:Georgia,serif;font-size:13px;cursor:pointer;transition:all 0.15s;text-align:left;letter-spacing:0.5px}
.uubtn:hover{background:rgba(14,72,48,0.88);border-color:var(--jade);color:var(--jade3)}
#uinp{width:100%;background:rgba(8,18,42,0.92);border:1px solid rgba(40,80,168,0.55);border-radius:3px;color:var(--mist);font-family:Georgia,serif;font-size:13px;padding:9px 13px;outline:none;margin-top:10px}
#uinp:focus{border-color:var(--jade2)}
/* TIMER + BADGE */
#timer-disp{font-size:11px;color:var(--sky3);letter-spacing:1px;white-space:nowrap;font-family:'Courier New',monospace;min-width:66px;text-align:right}
#user-badge{font-size:11px;color:var(--gold2);letter-spacing:1px;white-space:nowrap;padding:4px 10px;border:1px solid rgba(200,136,8,0.38);border-radius:3px;background:rgba(36,22,0,0.75);cursor:pointer;transition:all 0.15s}
#user-badge:hover{border-color:var(--gold2);background:rgba(48,30,0,0.9)}

/* PERSONAGEM POPUP */
#cpop{position:fixed;bottom:0;right:calc(50% - 500px);width:325px;z-index:200;display:none;flex-direction:row;align-items:flex-end;pointer-events:none}
@media(max-width:1000px){#cpop{right:0}}
.cbub{flex:1;background:rgba(7,14,34,0.99);border:1px solid rgba(96,48,168,0.88);border-radius:10px 10px 10px 0;padding:14px 16px;margin-bottom:24px;pointer-events:auto;position:relative;box-shadow:0 0 28px rgba(96,48,168,0.45),0 8px 36px rgba(0,0,0,0.65)}
.cbub::after{content:'';position:absolute;bottom:16px;right:-9px;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:9px solid rgba(96,48,168,0.88)}
.cname{font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.cmsg{font-size:13px;line-height:1.72;color:var(--mist);font-family:Georgia,serif}
.cclose{display:block;margin-top:9px;font-size:10px;color:var(--cloud2);cursor:pointer;letter-spacing:1px;text-align:right;pointer-events:auto;background:none;border:none;font-family:Georgia,serif;transition:color 0.15s}
.cclose:hover{color:var(--jade2)}
.cfig{width:110px;flex-shrink:0;position:relative;bottom:-2px}
.cfig svg{width:100%;display:block}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     FUNDO PRINCIPAL — crepúsculo sobre lago de lótus
     Lotus Pier (莲花坞) à esquerda · Cloud Recesses (雲深不知處) à direita
     ═══════════════════════════════════════════════════ -->
<div id="bgwrap">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#06041a"/>
      <stop offset="22%"  stop-color="#12105a"/>
      <stop offset="48%"  stop-color="#3a2878"/>
      <stop offset="72%"  stop-color="#884428"/>
      <stop offset="86%"  stop-color="#c87020"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="gwt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c2038"/>
      <stop offset="50%"  stop-color="#081428"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>
    <radialGradient id="ghorizon" cx="50%" cy="73%" r="45%">
      <stop offset="0%"   stop-color="#d06820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="gmoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#f8e090" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="gvign" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.48"/>
    </radialGradient>
    <filter id="fb"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="fm"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="ff"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="fg"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- CÉU CREPÚSCULO -->
  <rect width="1200" height="800" fill="url(#gsky)"/>
  <rect width="1200" height="800" fill="url(#ghorizon)"/>

  <!-- ESTRELAS -->
  <g fill="#e8e4fc" opacity="0.9">
    <circle cx="78"  cy="22"  r="1.3"/><circle cx="156" cy="12"  r="1.0"/>
    <circle cx="235" cy="34"  r="1.2"/><circle cx="318" cy="18"  r="0.9"/>
    <circle cx="398" cy="9"   r="1.1"/><circle cx="475" cy="28"  r="1.0"/>
    <circle cx="548" cy="15"  r="1.3"/><circle cx="632" cy="7"   r="0.9"/>
    <circle cx="712" cy="26"  r="1.1"/><circle cx="790" cy="16"  r="1.0"/>
    <circle cx="868" cy="33"  r="1.2"/><circle cx="944" cy="11"  r="0.9"/>
    <circle cx="1022" cy="24" r="1.1"/><circle cx="1098" cy="14" r="1.0"/>
    <circle cx="1165" cy="29" r="1.2"/>
    <circle cx="130" cy="54"  r="0.8" opacity="0.7"/>
    <circle cx="380" cy="46"  r="0.9" opacity="0.7"/>
    <circle cx="608" cy="50"  r="0.8" opacity="0.7"/>
    <circle cx="840" cy="42"  r="0.9" opacity="0.7"/>
    <circle cx="1060" cy="48" r="0.8" opacity="0.7"/>
    <circle cx="52"  cy="76"  r="0.7" opacity="0.55"/>
    <circle cx="272" cy="70"  r="0.8" opacity="0.55"/>
    <circle cx="500" cy="74"  r="0.7" opacity="0.55"/>
    <circle cx="750" cy="66"  r="0.8" opacity="0.55"/>
    <circle cx="1000" cy="72" r="0.7" opacity="0.55"/>
  </g>

  <!-- LUA CRESCENTE (brilhante, dourada) -->
  <circle cx="958" cy="78" r="60"  fill="#f8e090" opacity="0.07" filter="url(#ff)"/>
  <circle cx="958" cy="78" r="40"  fill="#f8e090" opacity="0.12" filter="url(#fm)"/>
  <circle cx="958" cy="78" r="26"  fill="#fff8e0" opacity="0.28"/>
  <circle cx="950" cy="70" r="26"  fill="#04091a" opacity="0.50"/>

  <!-- MONTANHAS DISTANTES — Cloud Recesses (branco-azulado, etéreo) -->
  <g opacity="0.22" filter="url(#ff)">
    <path d="M0 370 Q150 248 300 298 Q420 252 540 285 Q640 248 760 278 Q880 248 1000 275 Q1100 252 1220 268 L1220 500 L0 500 Z" fill="#d0ddf8"/>
  </g>
  <g opacity="0.32" filter="url(#fm)">
    <path d="M0 418 Q100 348 200 375 Q295 320 395 355 Q490 318 590 348 Q685 315 785 345 Q880 318 985 345 Q1070 322 1160 345 Q1188 332 1220 345 L1220 520 L0 520 Z" fill="#9098c8"/>
  </g>

let sessionStart=Date.now();

function fmtTime(s){
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const ss=s%60;
  return h>0?`${h}:${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`:`${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
}
setInterval(()=>{
  const el=document.getElementById('timer-disp');
  if(el)el.textContent='⏱ '+fmtTime(Math.floor((Date.now()-sessionStart)/1000));
},1000);

function startSubTimer(matId){
  stopSubTimer();
  subjectStart=Date.now();
  subjectMat=matId;
}
function stopSubTimer(){
  if(!subjectStart||!subjectMat||!curUser)return;
  const elapsed=Math.floor((Date.now()-subjectStart)/1000);
  if(elapsed>0){
    const data=getUserData(curUser);
    if(!data.subjects[subjectMat])data.subjects[subjectMat]={correct:0,total:0,seconds:0,label:''};
    data.subjects[subjectMat].seconds=(data.subjects[subjectMat].seconds||0)+elapsed;
    saveUserData(curUser,data);
  }
  subjectStart=null;
  subjectMat=null;
}

async function gerar(){
  if(!apiKey){
    alert('⚠ Insira sua chave API Anthropic no campo acima.\n\nAcesse: console.anthropic.com → API Keys\nCrie uma chave e cole aqui.');
    document.getElementById('apikey').focus();
    return;
  }
  const btn=document.getElementById('bgen');
  btn.disabled=true;
  btn.textContent='⏳ O Patriarca está invocando questões...';
  document.getElementById('cfg').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('quiz').innerHTML=`<div class="loading"><div class="sp"></div><br>Gerando ${cfg.qtd} questões sobre<br><span style="color:#fcd040;letter-spacing:2px">${cfg.mat.l}</span><br><span style="font-size:10px;letter-spacing:1px;margin-top:6px;display:block;color:#a09080">dificuldade · ${cfg.dif}</span></div>`;

  const hotI=cfg.hot
    ?'IMPORTANTE: foque nos tópicos mais cobrados pela FGV para EPPGG e APO em concursos 2019-2025.'
    :'Varie os tópicos de forma equilibrada.';

  const prompt=`Você é especialista em concursos públicos FGV para SEPLAG-RJ 2026 (cargos EPPGG e APO).
Gere exatamente ${cfg.qtd} questões de múltipla escolha sobre "${cfg.mat.l}" com dificuldade "${cfg.dif}".
${hotI}
Responda SOMENTE com JSON válido, sem texto antes, depois ou markdown, sem bloco de código.
{"questoes":[{"enunciado":"texto","alternativas":["A) texto","B) texto","C) texto","D) texto","E) texto"],"gabarito":0,"comentario":"explicação detalhada com fundamento legal ou doutrinário e por que esse tema é recorrente em provas FGV para EPPGG/APO","topico":"subtópico específico","probabilidade":"alta|media|baixa"}]}
"gabarito" = índice 0-4 da alternativa correta. Nível compatível com cargo superior FGV.`;

  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),120000);
    let r;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        signal:ctrl.signal,
        headers:{
          'Content-Type':'application/json',
          'x-api-key':apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body:JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:8000,
          messages:[{role:'user',content:prompt}]
        })
      });
    }finally{clearTimeout(tid);}
    if(!r.ok){
      const e=await r.json().catch(()=>({}));
      const msg=(e.error&&e.error.message)||`HTTP ${r.status}`;
      console.error('API error:',r.status,e);
      throw new Error(msg);
    }
    const data=await r.json();
    console.log('API response ok, stop_reason:', data.stop_reason);
    console.log('API content blocks:', JSON.stringify(data.content?.map(i=>({type:i.type,len:i.text?.length}))));
    const raw=data.content.map(i=>i.text||'').join('');
    console.log('Raw length:', raw.length, '| First 400 chars:', raw.slice(0,400));
    // Extrai o objeto JSON procurando pelo primeiro { e último }
    const s=raw.indexOf('{'), e=raw.lastIndexOf('}');
    const txt=s>=0&&e>s?raw.slice(s,e+1):raw;
    console.log('Extracted JSON length:', txt.length, '| Start:', txt.slice(0,100));
    let parsed;
    try{ parsed=JSON.parse(txt); }
    catch(pe){
      console.error('JSON parse error:',pe,'raw:',txt.slice(0,300));
      throw new Error('A resposta da IA não era um JSON válido. Tente novamente.');
    }
    qs=parsed.questoes;
    if(!qs||!qs.length) throw new Error('Nenhuma questão retornada. Tente novamente.');
    at=0;ac=0;si=null;resp=false;
    startSubTimer(cfg.mat.id);
    renderQ();
  }catch(e){
    const msg=e.name==='AbortError'?'Tempo limite esgotado (120s). Verifique sua conexão.':e.message;
    document.getElementById('quiz').innerHTML=`<div class="errb">⚠ Erro ao invocar questões: ${msg}<br><small style="opacity:0.7;margin-top:5px;display:block">Verifique a chave API e a conexão com a internet.</small></div><button class="bg" style="margin-top:11px;width:100%" onclick="voltarCfg()">← voltar às configurações</button>`;
    btn.disabled=false;
    btn.textContent='⚡ invocar questões com IA · 以武入道';
  }
}

// SISTEMA DE ÁUDIO — Web Audio API (sem arquivos externos)
// Sons: click de botão · acerto (guqin) · erro (tom grave)
// Música: arpejo pentatônico chinês ambiente
// ══════════════════════════════════════════════════════
let _ac=null;
function aCtx(){
  if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended')_ac.resume();
  return _ac;
}

function nota(freq,vol,dur,tipo='sine',delay=0){
  const c=aCtx(),osc=c.createOscillator(),g=c.createGain();
  osc.type=tipo; osc.frequency.value=freq;
  const t=c.currentTime+delay;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.018);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t+dur+0.05);
}

// Click sutil de interface
function playClick(){nota(680,0.032,0.07);}

// Acerto — guqin (harmônicos sobrepostos, decaimento longo)
function playCorrect(){
  nota(523.25,0.17,3.0,'sine',0.00);  // C5 fundamental
  nota(784.00,0.10,2.4,'sine',0.04);  // G5
  nota(1046.5,0.07,2.0,'sine',0.08);  // C6
  nota(1318.5,0.04,1.6,'sine',0.13);  // E6 harmônico
}

// Erro — descida de tom (bi-dūn)
function playWrong(){
  const c=aCtx(),osc=c.createOscillator(),g=c.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(210,c.currentTime);
  osc.frequency.exponentialRampToValueAtTime(75,c.currentTime+0.48);
  g.gain.setValueAtTime(0.20,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.58);
  osc.connect(g); g.connect(c.destination);
  osc.start(); osc.stop(c.currentTime+0.65);
}

// ── MÚSICA AMBIENTE: pentatônica chinesa (C D E G A) ──
const _PENTA=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
const _PAT  =[0,4,2,5,1,4,0,3,5,2,4,1,5,0,3,4,2,5,4,1];
const _BEAT =[920,640,1080,740,900,580,1180,820,960,660];
let _mon=false,_mtmr=null,_mgain=null,_mstep=0;

function startMusic(){
  const c=aCtx();
  _mgain=c.createGain(); _mgain.gain.value=0.062; _mgain.connect(c.destination);
  // Drones C2 + G2 (base grave contínua)
  [[65.41,0.30],[98.00,0.16]].forEach(([f,v])=>{
    const d=c.createOscillator(),dg=c.createGain();
    d.type='sine'; d.frequency.value=f; dg.gain.value=v;
    d.connect(dg); dg.connect(_mgain); d.start();
  });
  // Arpejo
  function tick(){
    if(!_mon)return;
    const freq=_PENTA[_PAT[_mstep%_PAT.length]];
    const osc=c.createOscillator(),og=c.createGain();
    osc.type='sine'; osc.frequency.value=freq;
    const t=c.currentTime;
    og.gain.setValueAtTime(0,t);
    og.gain.linearRampToValueAtTime(0.52,t+0.06);
    og.gain.exponentialRampToValueAtTime(0.0001,t+3.0);
    osc.connect(og); og.connect(_mgain);
    osc.start(t); osc.stop(t+3.1);
    _mstep++;
    _mtmr=setTimeout(tick,_BEAT[_mstep%_BEAT.length]);
  }
  _mon=true; tick(); updateMusicBtn();
}

function stopMusic(){
  _mon=false;
  if(_mtmr){clearTimeout(_mtmr);_mtmr=null;}
  if(_mgain){
    try{
      _mgain.gain.exponentialRampToValueAtTime(0.0001,aCtx().currentTime+1.4);
      setTimeout(()=>{try{_mgain.disconnect();}catch(e){}},1500);
    }catch(e){}
    _mgain=null;
  }
  updateMusicBtn();
}

function toggleMusic(){
  if(_mon)stopMusic(); else startMusic();
}

function updateMusicBtn(){
  const b=document.getElementById('musibtn');
  if(!b)return;
  b.textContent=_mon?'♫ on':'♫ off';
  b.classList.toggle('on',_mon);
}

// Click em qualquer botão ou chip dispara playClick
document.addEventListener('click',e=>{
  if(e.target.closest('button:not(#musibtn), .chip')) playClick();
},true);

// ══════════════════════════════════════════════════════
// PÉTALAS CAINDO (canvas animado)
// ══════════════════════════════════════════════════════
(function initPetals(){
  const cv=document.getElementById('petals');
  if(!cv)return;
  const resize=()=>{cv.width=window.innerWidth;cv.height=window.innerHeight;};
  resize();
  window.addEventListener('resize',resize);
  const cx=cv.getContext('2d');
  const COLS=['#f0a0b8','#e86090','#f8d0e0','#ffffff','#e8d890','#c8e0f8','#d0a0f0'];
  const N=24;
  const petals=Array.from({length:N},()=>({
    x:Math.random()*cv.width,
    y:Math.random()*cv.height,
    w:Math.random()*7+3,
    h:Math.random()*4+2,
    spd:Math.random()*0.55+0.18,
    drift:(Math.random()-0.5)*0.45,
    rot:Math.random()*Math.PI*2,
    rotS:(Math.random()-0.5)*0.022,
    alpha:Math.random()*0.40+0.10,
    col:COLS[Math.floor(Math.random()*COLS.length)]
  }));
  function frame(){
    cx.clearRect(0,0,cv.width,cv.height);
    petals.forEach(p=>{
      p.y+=p.spd; p.x+=p.drift; p.rot+=p.rotS;
      if(p.y>cv.height+16){p.y=-16;p.x=Math.random()*cv.width;}
      cx.save();
      cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.globalAlpha=p.alpha; cx.fillStyle=p.col;
      cx.beginPath(); cx.ellipse(0,0,p.w,p.h,0,0,Math.PI*2); cx.fill();
      cx.restore();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

// ── DESEMPENHO ──
function renderHist(){
  const el=document.getElementById('hist-c');

  // Mescla dados persistidos (localStorage) com sessão atual (hist)
  const userData=curUser?getUserData(curUser):{sessions:0,totalSeconds:0,subjects:{}};
  const merged={};
  // Adiciona dados persistidos
  Object.keys(userData.subjects||{}).forEach(k=>{
    merged[k]=Object.assign({},userData.subjects[k]);
  });
  // Mescla com sessão atual (hist)
  Object.keys(hist).forEach(k=>{
    if(!merged[k])merged[k]={correct:0,total:0,seconds:0,label:hist[k].l};
    else if(!merged[k].label)merged[k].label=hist[k].l;
    // Evita dupla contagem: só soma se este simulado ainda não foi salvo
    // (salvo em resultado(); aqui apenas exibe o estado atual)
    merged[k]._sesAc=(hist[k].ac||0);
    merged[k]._sesTot=(hist[k].tot||0);
  });

  const keys=Object.keys(merged);
  if(!keys.length){
    el.innerHTML='<div class="card" style="text-align:center;padding:2.5rem"><div style="font-size:42px;margin-bottom:12px">卷</div><div style="color:#fcd040;font-size:13px;letter-spacing:2px">nenhum dado ainda</div><div style="font-size:11px;color:#a09080;margin-top:7px;letter-spacing:1px">faça simulados para ver sua evolução</div></div>';
    return;
  }

  let totQ=0,totAc=0,totSec=0;
  keys.forEach(k=>{
    totQ +=(merged[k].total||0);
    totAc+=(merged[k].correct||0);
    totSec+=(merged[k].seconds||0);
  });
  const pG=totQ?Math.round((totAc/totQ)*100):0;
  const cG=pG>=70?'#40d490':pG>=50?'#fcd040':'#f04848';

  const rows=keys.map(k=>{
    const h=merged[k];
    const tot=h.total||0;
    const cor=h.correct||0;
    const p=tot?Math.round((cor/tot)*100):0;
    const c=p>=70?'#18b870':p>=50?'#fcd040':'#c82828';
    const sec=h.seconds||0;
    const lbl=h.label||(MAT.find(m=>m.id===k)||{l:k}).l;
    const tstr=sec>0?`<div style="font-size:9px;color:#8090a8;min-width:54px;text-align:right">⏱ ${fmtTime(sec)}</div>`:'';
    return`<div class="hrow">
      <div class="hn">${lbl}</div>
      <div class="ht"><div class="hb" style="width:${p}%;background:${c}"></div></div>
      <div class="hp" style="color:${c}">${p}%</div>
      <div class="hn2">${cor}/${tot}</div>
      ${tstr}
    </div>`;
  }).join('');

  const uName=curUser||'convidado';
  const sessLabel=(userData.sessions||0)+' simulado'+(( userData.sessions||0)!==1?'s':'');
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <div style="font-size:13px;color:var(--gold2);letter-spacing:1px">✦ ${uName}</div>
        <div style="font-size:10px;color:var(--cloud2);letter-spacing:1px;margin-top:3px">${sessLabel} concluído${(userData.sessions||0)!==1?'s':''}</div>
      </div>
      <button class="bg" style="font-size:10px;padding:4px 12px" onclick="showUserModal()">trocar cultivador</button>
    </div>
    <div class="s3" style="margin-bottom:15px">
      <div class="sb"><div class="sv" style="color:${cG}">${pG}%</div><div class="sl">aproveitamento</div></div>
      <div class="sb"><div class="sv">${totQ}</div><div class="sl">questões feitas</div></div>
      <div class="sb"><div class="sv" style="color:var(--sky3)">${fmtTime(totSec)}</div><div class="sl">tempo de estudo</div></div>
    </div>
    <div class="card" style="padding:13px 16px">
      <div class="clabel">✦ desempenho por matéria</div>
      ${rows}
    </div>
    <button class="bg" style="width:100%;margin-top:9px;font-size:10px"
      onclick="clearUserHist()">
      ✕ limpar histórico de ${uName}
    </button>`;
}
function clearUserHist(){
  if(!confirm('Limpar todo o histórico de '+( curUser||'convidado')+'?'))return;
  hist={};
  if(curUser){
    const data=getUserData(curUser);
    data.subjects={};data.sessions=0;
    saveUserData(curUser,data);
  }
  renderHist();
}
